<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>URL · Query Parser | DH.DevUtil</title><style>
:root{--ink:#182230;--muted:#5d6b7a;--line:#d9e1e8;--canvas:#f3f6f9;--blue:#155eef;font-family:"Segoe UI",Arial,sans-serif}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--canvas)}.shell{max-width:1200px;margin:auto;padding:24px}.topbar,.intro,.row,.buttons{display:flex;gap:10px}.topbar,.intro{justify-content:space-between;align-items:end}.topbar{align-items:center;margin-bottom:28px}.brand{display:inline-flex;gap:10px;align-items:center;color:var(--ink);font-weight:700;text-decoration:none}.mark{display:grid;width:34px;height:34px;place-items:center;border-radius:9px;color:#fff;background:var(--blue)}button{min-height:36px;padding:7px 11px;border:1px solid #c9d2dc;border-radius:7px;color:var(--ink);background:#fff;cursor:pointer;font:650 14px inherit}button:hover{border-color:#7ea4e8;color:#0f3f9f;background:#e8eefb}.primary,[aria-pressed=true]{border-color:var(--blue);color:#fff;background:var(--blue)}.primary:hover,[aria-pressed=true]:hover{color:#fff;background:#0d47c5}.eyebrow{margin:0 0 8px;color:var(--blue);font-size:.78rem;font-weight:700;letter-spacing:.09em}h1{margin:0;font-size:clamp(1.8rem,4vw,2.5rem)}.intro p{max-width:670px;color:var(--muted);line-height:1.55}.grid{display:grid;grid-template-columns:.8fr 1.5fr;gap:16px;margin-top:18px}.pane{overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 2px 6px #1822300a}.head{display:flex;justify-content:space-between;padding:18px;border-bottom:1px solid var(--line)}.content{display:grid;gap:14px;padding:18px}label{display:grid;gap:6px;font-weight:700}input,textarea{width:100%;padding:10px;border:1px solid #bdcad8;border-radius:7px;color:var(--ink);background:#fbfcfd;font:inherit}textarea{min-height:330px;resize:vertical;font-family:Consolas,monospace;line-height:1.5}input:focus,textarea:focus,button:focus-visible{outline:3px solid #9ab8ff;outline-offset:1px}.row>*{flex:1}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{color:var(--muted);font-size:.82rem;background:#f8fafc}.mono{font-family:Consolas,monospace;word-break:break-all}.status{padding:10px;border:1px solid #a6f4c5;border-radius:7px;color:#067647;background:#ecfdf3}.status[data-kind=error]{border-color:#fecdca;color:#b42318;background:#fef3f2}.guide{color:var(--muted);line-height:1.6}@media(max-width:760px){.shell{padding:16px}.topbar,.intro{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.row{flex-direction:column}}
</style></head><body><div class="shell"><header class="topbar"><a class="brand" href="#"><span class="mark">DH</span><span>DH.DevUtil</span></a><div><button data-lang="en" aria-pressed="true" type="button">English</button><button data-lang="ko" aria-pressed="false" type="button">한국어</button></div></header><div class="intro"><div><p class="eyebrow" data-i="eyebrow">WEB · PARSING</p><h1 data-i="title">URL · Query Parser</h1></div><p data-i="intro">Parse a URL locally, inspect every component, and edit query parameters without sending the address anywhere.</p></div><div class="grid"><section class="pane"><div class="head"><h2 data-i="input">Input</h2><span>01</span></div><div class="content"><label><span data-i="url">URL</span><textarea id="input" spellcheck="false">https://example.com:8443/api/items?tag=one&amp;tag=two&amp;page=2#results</textarea></label><div class="buttons"><button id="parse" class="primary" type="button" data-i="parse">Parse</button><button id="sample" type="button" data-i="sample">Load sample</button><button id="clear" type="button" data-i="clear">Clear</button></div><div id="status" class="status">Ready</div><p class="guide" data-i="hint">Query parameters are shown as decoded key/value pairs. Duplicate keys remain separate.</p></div></section><section class="pane"><div class="head"><h2 data-i="result">URL components</h2><span>02</span></div><div class="content"><div class="table-wrap"><table class="table"><thead><tr><th data-i="component">Component</th><th data-i="value">Value</th></tr></thead><tbody id="parts"></tbody></table></div><div class="row"><label><span data-i="key">Query key</span><input id="key"></label><label><span data-i="queryValue">Query value</span><input id="queryValue"></label></div><div class="buttons"><button id="add" type="button" data-i="add">Add/update parameter</button><button id="remove" type="button" data-i="remove">Remove parameter</button><button id="copy" type="button" data-i="copy">Copy URL</button></div><label><span data-i="edited">Edited URL</span><input id="edited" readonly></label></div></section></div></div><script>
const i18n={en:{eyebrow:'WEB · PARSING',title:'URL · Query Parser',intro:'Parse a URL locally, inspect every component, and edit query parameters without sending the address anywhere.',input:'Input',url:'URL',parse:'Parse',sample:'Load sample',clear:'Clear',hint:'Query parameters are shown as decoded key/value pairs. Duplicate keys remain separate.',result:'URL components',component:'Component',value:'Value',key:'Query key',queryValue:'Query value',add:'Add/update parameter',remove:'Remove parameter',copy:'Copy URL',edited:'Edited URL',ready:'Ready',done:'Parsed locally',error:'Error: ',copied:'Copied'},ko:{eyebrow:'웹 · 파싱',title:'URL · Query Parser',intro:'주소를 외부로 보내지 않고 URL 구성요소와 Query parameter를 로컬에서 확인·편집합니다.',input:'입력',url:'URL',parse:'파싱',sample:'샘플 불러오기',clear:'지우기',hint:'Query parameter는 decode된 key/value로 표시합니다. 중복 key는 각각 유지합니다.',result:'URL 구성요소',component:'구성요소',value:'값',key:'Query key',queryValue:'Query value',add:'Parameter 추가/수정',remove:'Parameter 삭제',copy:'URL 복사',edited:'편집된 URL',ready:'준비됨',done:'로컬에서 파싱됨',error:'오류: ',copied:'복사됨'}};let lang=localStorage.getItem('dhdevutil-language')||'en',$=id=>document.getElementById(id),t=k=>i18n[lang][k],current=null;function setLang(n){lang=n;localStorage.setItem('dhdevutil-language',n);document.documentElement.lang=n;document.querySelectorAll('[data-i]').forEach(x=>x.textContent=t(x.dataset.i));document.querySelectorAll('[data-lang]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.lang===n)))}function row(k,v){return `<tr><th>${k}</th><td class="mono">${String(v||'—').replaceAll('&','&amp;').replaceAll('<','&lt;')}</td></tr>`}function parse(){try{current=new URL($('input').value.trim());const pairs=[...current.searchParams.entries()];$('parts').innerHTML=[['href',current.href],['protocol',current.protocol],['username',current.username],['password',current.password?'••••':''],['host',current.host],['hostname',current.hostname],['port',current.port],['pathname',current.pathname],['search',current.search],['hash',current.hash],['origin',current.origin],['query count',pairs.length]].map(([k,v])=>row(k,v)).join('');$('edited').value=current.href;$('status').textContent=t('done');$('status').dataset.kind='success'}catch(e){$('status').textContent=t('error')+e.message;$('status').dataset.kind='error'}}function update(remove=false){if(!current)parse();if(!current)return;const k=$('key').value;if(!k)return;remove?current.searchParams.delete(k):current.searchParams.set(k,$('queryValue').value);$('input').value=current.href;parse()}$('parse').onclick=parse;$('sample').onclick=()=>{$('input').value='https://api.example.test/v1/search?q=hello%20world&tag=one&tag=two&limit=20#top';parse()};$('clear').onclick=()=>{$('input').value='';$('parts').innerHTML='';$('edited').value='';$('status').textContent=t('ready');current=null};$('add').onclick=()=>update(false);$('remove').onclick=()=>update(true);$('copy').onclick=async()=>{await navigator.clipboard.writeText($('edited').value);$('status').textContent=t('copied')};$('input').oninput=parse;document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));setLang(lang);parse();
</script></body></html>
