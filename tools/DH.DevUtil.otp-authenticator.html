  async function render() { const n=++revision, list=$('accounts'); list.replaceChildren(); const search=$('search').value.toLocaleLowerCase(), visible=accounts.map((a,i)=>({a,i})).filter(x=>x.a.name.toLocaleLowerCase().includes(search)).sort((x,y)=>Number(!!y.a.favorite)-Number(!!x.a.favorite)); $('count').textContent=key?String(visible.length):''; $('empty').textContent=key&&!visible.length?t('empty'):''; for (const {a,i} of visible) { const code=await otp(a); if (n!==revision || !key) return; const card=document.createElement('article'); card.className='account'; card.dataset.index=String(i); const head=document.createElement('div'); head.className='account-head'; const name=document.createElement('div'); name.className='account-name'; name.textContent=a.name; const meta=document.createElement('div'); meta.className='account-meta'; meta.textContent=`${a.algorithm} · ${a.digits} digits · ${a.period}s`; head.append(name,meta); const output=document.createElement('div'); output.className='otp'; output.textContent=code; const seconds=a.period-Math.floor(Date.now()/1000)%a.period; const meter=document.createElement('div'); meter.className='meter'; const fill=document.createElement('span'); fill.style.width=(100*seconds/a.period)+'%'; meter.append(fill); const remaining=document.createElement('div'); remaining.className='muted'; remaining.textContent=seconds+' '+t('remaining'); const actions=document.createElement('div'); actions.className='row'; for (const [label,fn] of [['copy',async()=>{try{await navigator.clipboard.writeText(await otp(a));notice('copied','success')}catch{notice('copyError','error')}}],['edit',()=>{editing=i; $('name').value=a.name; $('secret').value=a.secret; $('recovery').value=a.recovery || ''; $('recovery-editor').open=false; $('algorithm').value=a.algorithm; $('digits').value=String(a.digits); $('period').value=String(a.period); $('name').focus()}],['remove',async()=>{if(!confirm(t('deleteConfirm'))||busy)return; busy=true; try { await persist(   function parseUri(value) { const u=new URL(value); if(u.protocol!=='otpauth:'||u.hostname!=='totp')throw Error('uri'); const params=u.searchParams, name=decodeURIComponent(u.pathname.slice(1)); const a={name,secret:params.get('secret')||'',algorithm:(params.get('algorithm')||'SHA1').toUpperCase(),digits:Number(params.get('digits')||6),period:Number(params.get('period')||30)}; if(!validAccount(a))throw Error('uri'); $('name').value=a.name; $('secret').value=a.secret; $('algorithm').value=a.algorithm; $('digits').value=String(a.digits); $('period').value=String(a.period); }
  $('unlock').onclick=async()=>{ if(busy)return; busy=true; const pass=$('password').value; try { const existing=readVault(); if(existing) { if(!validVault(existing))throw Error('vault'); const k=await derive(pass,bytes(existing.salt),existing.iterations), plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(existing.iv)},k,bytes(existing.data)); const decoded=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(plain)); if(!Array.isArray(decoded)||!decoded.every(validAccount))throw Error('vault'); key=k; vault=existing; accounts=decoded; notice('opened','success'); } else { if(pass.length<12||pass!==$('confirm').value){notice('passwordShort','error');return} const salt=crypto.getRandomValues(new Uint8Array(16)); key=await derive(pass,salt,iterations); vault={format:'DH.DevUtil.OTP',version:1,kdf:'PBKDF2-SHA256',iterations,salt:b64(salt)}; await persist([]); notice('created','success'); } $('password').value=''; $('confirm').value=''; touch(); refresh(); } catch { key=null;vault=null;accounts=[];notice('wrong','error');refresh(); } finally { busy=false; } };
  $('save').onclick=async()=>{ if(!key||busy)return; const a={name:$('name').value.trim(),secret:$('secret').value.replace(/[\s-]/g,'').toUpperCase(),algorithm:$('algorithm').value,digits:Number($('digits').value),period:Number($('period').value),recovery:$('recovery').value.trim()}; if(!validAccount(a)){notice('invalid','error');return} const next=accounts.slice(); if(editing===null)next.push(a);else next[editing]={...a,favorite:!!next[editing].favorite}; busy=true; try {await persist(next);clearEditor();render();notice('saved','success')} catch {notice('unavailable','error')} finally {busy=false} };
  $('recovery-dialog').addEventListener('close',()=>{$('recovery-direct').value='';$('recovery-account').textContent='';recoveryIndex=null});
  $('recovery-close').onclick=()=>$('recovery-dialog').close(); $('recovery-cancel').onclick=()=>$('recovery-dialog').close();

  $('idle-time').value=['5','15','30','60','0'].includes(localStorage.getItem(idleSettingKey))?localStorage.getItem(idleSettingKey):'30';

  $('idle-time').onchange=()=>{try{localStorage.setItem(idleSettingKey,$('idle-time').value);savedIdle=$('idle-time').value;idleFeedback='applied';touch()}catch{$('idle-time').value=savedIdle;idleFeedback='error'}showIdleFeedback()};

  $('parse').onclick=()=>{try{parseUri($('uri').value)}catch{notice('badUri','error')}}; $('cancel').onclick=clearEditor; $('lock').onclick=()=>lock(); $('show-secret').onclick=()=>{$('secret').type=$('secret').type==='password'?'text':'password';$('show-secret').textContent=t($('secret').type==='password'?'show':'hide')}; $('search').oninput=render;
  $('qr-file').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{if(!('BarcodeDetector'in window))throw Error('unsupported');const bitmap=await createImageBitmap(file);try{const codes=await new BarcodeDetector({formats:['qr_code']}).detect(bitmap);if(!codes.length)throw Error('qr');parseUri(codes[0].rawValue)}finally{bitmap.close()}}catch{notice('badQr','error')}};
  $('export').onclick=()=>{const blob=new Blob([JSON.stringify(vault,null,2)],{type:'application/json'}), url=URL.createObjectURL(blob), a=document.createElement('a');a.href=url;a.download='otp-vault-encrypted.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
